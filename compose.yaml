services:
  app:
    build:
      context: .
      target: runtime
    image: ghcr.io/ndndndn1/bms-edge-anomaly-runtime:latest
    ports:
      - "127.0.0.1:8801:8000"
    environment:
      BMS_WINDOW: "32"
      BMS_CELLS: "8"
      BMS_WARN_SCORE: "8"
      BMS_CRITICAL_SCORE: "20"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
